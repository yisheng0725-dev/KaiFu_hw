<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      .Syringe {
         z-index: 3;
         position: absolute;
         border: 1px solid #d0d0d0;
         width: 50px;
         height: 150px;
         background: #000;
         position: absolute;
         top: 50%;
         left: 50%;
         transform: translate(-50%, -50%)
      }

      .Syringe::before {
         content: "Made in Taiwan";
         color: #7f7f7f;
         font-size: 14px;
         font-family: Arial, sans-serif;

         display: flex;
         align-items: flex-end;
         justify-content: flex-start;
         padding: 10px 12px;
         box-sizing: border-box;
         width: 300px;
         height: 150px;
         border: 1px solid #d0d0d0;
         border-radius: 4px;
         /* 雙層背景組合 */
         background:
            /* 1. 刻度層：設定為由左到右重複的黑線 */
            repeating-linear-gradient(to right,
               #7f7f7f,
               #7f7f7f 1px,
               transparent 1px,
               transparent 25px) no-repeat,
            /* 2. 原本的玻璃反射漸層 */
            linear-gradient(to bottom,
               #ffffff 0%,
               #f2f2f2 50%,
               #e1e1e1 51%,
               #f5f5f5 100%);

         background-size: 90% 15px, 100% 100__;
         background-size: 90% 15px, 100% 100%;
         position: absolute;
         right: 50px
      }

      .Syringe::after {
         content: "";
         width: 300px;
         height: 150px;
         border: 1px solid #d0d0d0;
         border-radius: 4px;
         /* 雙層背景組合 */
         background:
            /* 1. 刻度層：設定為由左到右重複的黑線 */
            repeating-linear-gradient(to right,
               #7f7f7f,
               #7f7f7f 1px,
               transparent 1px,
               transparent 30px) no-repeat,
            /* 2. 原本的玻璃反射漸層 */
            linear-gradient(to bottom,
               #efde8e 0%,
               #cbbb6d 50%,
               #cbbb6d 51%,
               #efde8e 100%);

         background-size: 90% 15px, 100% 100__;
         background-size: 90% 15px, 100% 100%;
         position: absolute;
         left: 50px;
      }

      .button {
         border: 1px solid #d0d0d0;
         width: 50px;
         height: 80px;
         position: absolute;
         top: 50%;
         left: -650%;
         transform: translate(-50%, -50%);
         background: linear-gradient(to bottom,
               #ffffff 0%,
               #f2f2f2 50%,
               #e1e1e1 51%,
               #f5f5f5 100%);
      }

      .button::before {
         content: "";
         border: 1px solid #d0d0d0;
         width: 50px;
         height: 120px;
         position: absolute;
         top: 50%;
         left: -50%;
         transform: translate(-50%, -50%);
         background: linear-gradient(to bottom,
               #ffffff 0%,
               #f2f2f2 50%,
               #e1e1e1 51%,
               #f5f5f5 100%);
      }

      .needle {
         content: "";
         border: 1px solid #d0d0d0;
         width: 50px;
         height: 120px;
         position: absolute;
         top: 50%;
         left: 720%;
         transform: translate(-50%, -50%);
         background: linear-gradient(to bottom,
               #ffffff 0%,
               #f2f2f2 50%,
               #e1e1e1 51%,
               #f5f5f5 100%);
      }

      .needle::before {
         content: "";
         border: 1px solid #d0d0d0;
         width: 100px;
         height: 1.2px;
         position: absolute;
         top: 50%;
         left: 200%;
         transform: translate(-50%, -50%);
         background: linear-gradient(to bottom,
               #ffffff 0%,
               #f2f2f2 50%,
               #e1e1e1 51%,
               #f5f5f5 100%)
      }
   </style>
</head>


<body>

   <div class="piston"></div>

   <div class="Syringe">
      <div class="needle"></div>
      <div class="button"></div>
   </div>
</body>

</html>
